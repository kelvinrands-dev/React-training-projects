<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <style>
    body{
      font-family: Arial;
      margin-top:0px;
      margin-bottom: 0px;
    }

    .send-btn {
      background-color:rgb(25, 135, 84);
      color:white;
      padding:12px 20px;
      margin-left: 10px;
      border:none;
      border-radius: 10px;
      font-size:15px;
      cursor: pointer;
    }

    .chat-input{
      padding:12px 15px;
      border-radius: 10px;
      border-width: 1px;
      font-size:15px;

      flex-grow:1;
    }

    .chat-input-container{
      display: flex;
      margin-bottom: 60px;
    }

    .app-container{
      margin-left:auto;
      margin-right:auto;
      max-width:600px;
      height:100vh;

      display: flex;
      flex-direction: column;
      
    }

    .chat-message-user{
      display:flex;
      justify-content: end;
      align-items: start;
    }

    .chat-message-robot{
      display: flex;
      align-items: start;
    }

    .chat-message-text{
      background: rgb(238, 238, 238);
      padding:15px 20px;
      border-radius:10px;
      margin-right:10px;
      margin-left:10px;
      margin-bottom: 20px;
      max-width:300px;
    }

    .chat-message-profile{
      width:45px;
    }

    .chat-messages-container{
      flex-grow:1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width:none;
    }

    .initial-display-text{
      margin-top: 20px;
      text-align: center;
      color:gray;
    }

    .loading-spinner{
      width:2rem;
    }
  </style>
    
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
       
      function ChatInput({chatMessagesVar,setChatMessagesVar}){

        const [inputText,setInputText] = React.useState("");
        const [isLoading,setIsLoading] = React.useState(false);

        const saveInputText = (e)=>{
          setInputText(e.target.value);
        }

        async function sendMessage(){
          if(inputText===""){alert("Enter a message"); return}
          if(isLoading){return}

          setIsLoading(true)
          const newChatMessages = [
            ...chatMessagesVar,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID()
            }]

            setChatMessagesVar(newChatMessages)
            setInputText("")

            setChatMessagesVar([
              ...newChatMessages,
              {
                message:<img className="loading-spinner" src="loading-spinner.gif" />,
                sender:"robot",
                id: crypto.randomUUID()
              }
            ])

            const response = await Chatbot.getResponseAsync(inputText);

            setChatMessagesVar([
              ...newChatMessages,
              {
                message:response,
                sender:"robot",
                id: crypto.randomUUID()
              }
            ])
          
            setIsLoading(false)
        }

        function keyDown(e){
          if(e.key==="Enter"){
            sendMessage();
          }
          if(e.key==="Escape"){
            setInputText("")
          }
        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to Chatbot" 
              size="30"
              onChange={saveInputText}
              onKeyDown={keyDown}
              value={inputText}
              className="chat-input"
            />
            <button onClick={sendMessage} className="send-btn" >
              Send
            </button>
            
          </div>
        );
      }




      function ChatMessage({message,sender}){
        //const message = props.message;
        //const
        /*if(sender==="robot"){
          return(
            <div>
              <img src="robot.png" width="50"/>
              {message}
            </div>
          );
        }*/

        return (
          <div className={sender==="user"?
            "chat-message-user" : "chat-message-robot"}
          >
            {sender === "robot" && 
              (<img className="chat-message-profile" src="robot.png"/>)
            }
            <div className="chat-message-text">{message}</div>
            {sender === "user" && 
              (<img className="chat-message-profile" src="user.png"/>)
            }
            
          </div>
        )
      }

      function useAutoScroll(chatMessagesVar){
        const chatMessagesRef = React.useRef(null);

        React.useEffect(()=>{
          const containerElem = chatMessagesRef.current;

          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        },[chatMessagesVar]);

        return chatMessagesRef;
      }
      
      function ChatMessages ({chatMessagesVar}){
        const chatMessagesRef = useAutoScroll(chatMessagesVar)

        return(
          <div className="chat-messages-container"
          ref={chatMessagesRef}
          >
            {chatMessagesVar.map((chaMess)=>{
              return (
                <ChatMessage 
                  message={chaMess.message}
                  sender={chaMess.sender}
                  key={chaMess.id}
                />
              )})
            }
          </div>
        )
      }

      function InitialDisplayText ({chatMessagesVar}){
        if(chatMessagesVar.length!==0)return;

        return(
          <div className="initial-display-text">
            Welcome to the chatbot project! Send a message using the textbox below.
          </div>
        )
      }


      function App(){
        const [chatMessagesVar, setChatMessagesVar] = React.useState([])
        //const [chatMessagesVar,setChatMessagesVar] = array
        //const chatMessagesVar = array[0];
        //const setChatMessagesVar = array[1];
    

        return(
          <div className="app-container">

            <InitialDisplayText
              chatMessagesVar={chatMessagesVar}
            />
      
            <ChatMessages 
              chatMessagesVar={chatMessagesVar}
            />
            <ChatInput
              chatMessagesVar={chatMessagesVar}
              setChatMessagesVar={setChatMessagesVar}
            />
            
          </div>
        );
      }


        
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);

    </script>
  </body>
</html>
